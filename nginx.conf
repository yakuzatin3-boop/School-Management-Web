map $http_x_forwarded_proto $upstream_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Protect credential endpoints from brute-force attempts. A shared zone means
# the limit applies across login, registration, and token refresh.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Allow small JSON payloads only; school records do not need large uploads.
    client_max_body_size 2m;

    # Security headers for the browser application.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Compression for text assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Lightweight container health endpoint.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Throttle credential endpoints only; session checks and logout stay fast.
    location = /api/v1/auth/login {
        limit_req zone=auth_limit burst=20 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy-api.conf;
    }

    location = /api/v1/auth/register {
        limit_req zone=auth_limit burst=20 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy-api.conf;
    }

    location = /api/v1/auth/refresh {
        limit_req zone=auth_limit burst=20 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy-api.conf;
    }

    # Send API requests to the NestJS container. Keeping the same origin means
    # the browser never needs CORS in the Docker deployment.
    location /api/ {
        include /etc/nginx/snippets/proxy-api.conf;
    }

    # Long-lived cache for Vite's hashed assets. Security headers must be
    # repeated because any add_header here overrides server-level headers.
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page application fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the HTML entry point.
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-store";
    }
}
